name: ee-pulse

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${EE_PULSE_POSTGRES_DB:-ee_pulse}
      POSTGRES_USER: ${EE_PULSE_POSTGRES_USER:-ee_pulse}
      POSTGRES_PASSWORD: ${EE_PULSE_POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - data

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.148.0
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=30d
    volumes:
      - victoria-metrics-data:/victoria-metrics-data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8428/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - data

  api:
    build:
      context: .
      dockerfile: src/backend/EePulse.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${EE_PULSE_POSTGRES_DB:-ee_pulse};Username=${EE_PULSE_POSTGRES_USER:-ee_pulse};Password=${EE_PULSE_POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "${EE_PULSE_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      victoria-metrics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - edge
      - data

volumes:
  postgres-data:
  victoria-metrics-data:

networks:
  edge:
  data:
    internal: true
